<!DOCTYPE html>
<!-- @dsCard group="Components" name="Dropdowns & selects" subtitle="Open select menu, closed select, segmented control" viewport="700x240" -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @import url("../colors_and_type.css");
  html,body{margin:0}
  body{background:hsl(220 20% 8%);font-family:var(--font-sans);color:hsl(220 10% 95%);padding:24px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
  .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:hsl(var(--muted-foreground));font-weight:600;margin-bottom:9px}
  .select{height:40px;border:1px solid hsl(var(--input));background:hsl(220 18% 12%);border-radius:6px;
    display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:14px}
  .select.open{border-color:hsl(220 70% 55%);box-shadow:0 0 0 2px hsl(220 70% 55% / .3)}
  .select svg{width:16px;height:16px;color:hsl(var(--muted-foreground))}
  .menu{margin-top:6px;border:1px solid hsl(var(--border));background:hsl(220 18% 13%);border-radius:8px;
    box-shadow:var(--elevation-3);padding:5px;overflow:hidden}
  .opt{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:6px;font-size:13.5px;color:hsl(220 11% 84%)}
  .opt:hover{background:hsl(var(--foreground) / .06)}
  .opt.sel{background:hsl(220 70% 55% / .12);color:hsl(220 70% 66%)}
  .opt .ck{width:15px;height:15px;color:hsl(165 50% 58%)}
  .opt .ck svg{width:15px;height:15px}
  .seg{display:flex;background:hsl(220 15% 15%);border-radius:8px;padding:3px;gap:3px;width:fit-content}
  .seg span{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;color:hsl(var(--muted-foreground))}
  .seg span.on{background:hsl(220 70% 55%);color:hsl(220 20% 8%)}
  .hint{font-size:11px;color:hsl(var(--muted-foreground));margin-top:14px}
</style>
</head>
<body>
  <div class="grid">
    <div>
      <div class="lab">Select — open</div>
      <div class="select open"><span>Proof</span><svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></div>
      <div class="menu">
        <div class="opt">All surfaces</div>
        <div class="opt">Labs</div>
        <div class="opt sel">Proof <span class="ck"><svg fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span></div>
        <div class="opt">Insights</div>
      </div>
    </div>
    <div>
      <div class="lab">Closed select</div>
      <div class="select"><span style="color:hsl(var(--muted-foreground))">Select a type…</span><svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></div>
      <div class="lab" style="margin-top:24px">Segmented control</div>
      <div class="seg"><span class="on">Grid</span><span>List</span><span>Map</span></div>
      <div class="hint">Menus: card surface, elevation-3, selected row = primary wash + teal check.</div>
    </div>
  </div>
</body>
</html>
