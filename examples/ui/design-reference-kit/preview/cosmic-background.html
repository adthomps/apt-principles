<!DOCTYPE html>
<!-- @dsCard group="Brand" name="CosmicBackground" subtitle="Navy base, radial glows, starfield layers" viewport="700x240" -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @import url("../colors_and_type.css");
  html,body{margin:0}
  body{margin:0}
  .stage{position:relative;height:240px;overflow:hidden;background:hsl(220 20% 8%);font-family:var(--font-sans)}
  .glows{position:absolute;inset:0;background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, hsl(220 70% 55% / .15), transparent),
    radial-gradient(ellipse 60% 40% at 80% 0%, hsl(165 45% 40% / .08), transparent),
    radial-gradient(ellipse 50% 30% at 20% 10%, hsl(220 70% 55% / .1), transparent)}
  .stars{position:absolute;inset:0;opacity:.5;background-image:
    radial-gradient(1px 1px at 20px 30px, hsl(220 10% 95% / .8), transparent),
    radial-gradient(1px 1px at 90px 40px, hsl(220 10% 95% / .5), transparent),
    radial-gradient(1px 1px at 160px 120px, hsl(220 10% 95% / .4), transparent),
    radial-gradient(1px 1px at 230px 50px, hsl(220 10% 95% / .5), transparent),
    radial-gradient(1.5px 1.5px at 300px 90px, hsl(220 10% 95% / .8), transparent),
    radial-gradient(2px 2px at 380px 60px, hsl(220 70% 55% / .5), transparent),
    radial-gradient(1px 1px at 460px 150px, hsl(220 10% 95% / .6), transparent),
    radial-gradient(1.5px 1.5px at 560px 40px, hsl(165 45% 40% / .5), transparent),
    radial-gradient(1px 1px at 620px 110px, hsl(220 10% 95% / .5), transparent);
    background-size:660px 200px}
  .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .veil{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:560px;height:200px;
    background:radial-gradient(ellipse at center, hsl(220 22% 7% / .92) 0%, hsl(220 22% 7% / .7) 45%, transparent 72%)}
  .inner{position:relative}
  .lab{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:hsl(220 70% 68%);font-weight:600}
  .h{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:8px;color:hsl(220 10% 98%)}
  .s{font-size:14px;color:hsl(220 12% 78%);margin-top:6px}
</style>
</head>
<body>
  <div class="stage">
    <div class="glows"></div>
    <div class="stars"></div>
    <div class="c">
      <div class="veil"></div>
      <div class="inner">
        <div class="lab">CosmicBackground</div>
        <div class="h">Systems over screens.</div>
        <div class="s">Navy base · radial glows · two starfield layers</div>
      </div>
    </div>
  </div>
</body>
</html>
