<!DOCTYPE html>
<!-- @dsCard group="Components" name="Chart — multi-series" subtitle="Three series on the chart ramp with gridlines" viewport="700x250" -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @import url("../colors_and_type.css");
  html,body{margin:0}
  body{background:hsl(220 20% 8%);color:hsl(220 10% 95%);font-family:var(--font-sans);padding:22px}
  .card{border:1px solid hsl(var(--border));background:hsl(var(--card));border-radius:12px;padding:18px 20px;box-shadow:var(--elevation-3)}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:hsl(var(--muted-foreground));font-weight:600}
  .legend{display:flex;gap:14px;font-size:11px;color:hsl(var(--muted-foreground))}
  .legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
  .axis{display:flex;justify-content:space-between;font-size:10px;color:hsl(var(--muted-foreground));font-family:var(--font-mono);margin-top:8px}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="eyebrow">Adoption by surface — last 8 weeks</div>
      <div class="legend">
        <span><i style="background:hsl(220 70% 55%)"></i>Labs</span>
        <span><i style="background:hsl(165 45% 45%)"></i>Proof</span>
        <span><i style="background:hsl(280 55% 60%)"></i>Insights</span>
      </div>
    </div>
    <svg width="100%" height="150" viewBox="0 0 600 150" preserveAspectRatio="none">
      <line x1="0" y1="37" x2="600" y2="37" stroke="hsl(220 15% 20%)" stroke-width="1"/>
      <line x1="0" y1="75" x2="600" y2="75" stroke="hsl(220 15% 20%)" stroke-width="1"/>
      <line x1="0" y1="113" x2="600" y2="113" stroke="hsl(220 15% 20%)" stroke-width="1"/>
      <polyline points="0,110 85,98 170,104 255,80 340,72 425,58 510,46 600,30" fill="none" stroke="hsl(220 70% 60%)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="0,124 85,118 170,110 255,112 340,96 425,98 510,84 600,72" fill="none" stroke="hsl(165 45% 50%)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="0,132 85,130 170,126 255,120 340,118 425,108 510,110 600,100" fill="none" stroke="hsl(280 55% 62%)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="600" cy="30" r="3.5" fill="hsl(220 70% 65%)"/>
      <circle cx="600" cy="72" r="3.5" fill="hsl(165 45% 55%)"/>
      <circle cx="600" cy="100" r="3.5" fill="hsl(280 55% 65%)"/>
    </svg>
    <div class="axis"><span>W1</span><span>W2</span><span>W3</span><span>W4</span><span>W5</span><span>W6</span><span>W7</span><span>W8</span></div>
  </div>
</body>
</html>
