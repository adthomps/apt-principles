<!DOCTYPE html>
<!-- @dsCard group="Components" name="Chart — trend" subtitle="Area/line with KPI, primary blue + glow" viewport="700x270" -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @import url("../colors_and_type.css");
  html,body{margin:0}
  body{background:hsl(220 20% 8%);color:hsl(220 10% 95%);font-family:var(--font-sans);padding:22px}
  .card{border:1px solid hsl(var(--border));background:hsl(var(--card));border-radius:12px;padding:20px;box-shadow:var(--elevation-3)}
  .top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:4px}
  .eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:hsl(var(--muted-foreground));font-weight:600}
  .kpi{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:5px}
  .delta{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:hsl(165 50% 58%);
    background:hsl(165 45% 40% / .12);border:1px solid hsl(165 45% 40% / .35);padding:3px 9px;border-radius:9999px}
  .delta svg{width:13px;height:13px}
  .chart{margin-top:8px}
  .axis{display:flex;justify-content:space-between;font-size:10px;color:hsl(var(--muted-foreground));font-family:var(--font-mono);margin-top:6px}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div>
        <div class="eyebrow">Weekly active systems</div>
        <div class="kpi">1,284</div>
      </div>
      <span class="delta">
        <svg fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        +12.4%
      </span>
    </div>
    <div class="chart">
      <svg width="100%" height="120" viewBox="0 0 560 120" preserveAspectRatio="none">
        <defs>
          <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="hsl(220 70% 55%)" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="hsl(220 70% 55%)" stop-opacity="0"/>
          </linearGradient>
          <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
            <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <path d="M0,92 L80,78 L160,84 L240,54 L320,60 L400,34 L480,40 L560,16 L560,120 L0,120 Z" fill="url(#fill)"/>
        <path d="M0,92 L80,78 L160,84 L240,54 L320,60 L400,34 L480,40 L560,16" fill="none" stroke="hsl(220 70% 60%)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        <circle cx="560" cy="16" r="4" fill="hsl(220 70% 65%)"/>
      </svg>
    </div>
    <div class="axis"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
  </div>
</body>
</html>
