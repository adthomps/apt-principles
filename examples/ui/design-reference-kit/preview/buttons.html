<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary, secondary, outline, ghost, accent, link, pill" viewport="700x160" -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @import url("../colors_and_type.css");
  html,body{margin:0}
  body{background:hsl(220 20% 8%);color:hsl(220 10% 95%);font-family:var(--font-sans);padding:24px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .row+.row{margin-top:14px}
  .btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .2s var(--ease-apt)}
  .primary{background:hsl(220 70% 55%);color:hsl(220 20% 8%);box-shadow:var(--elevation-1)}
  .primary:hover{background:hsl(220 70% 50%)}
  .secondary{background:hsl(220 15% 18%);color:hsl(220 10% 90%);border-color:hsl(var(--border))}
  .outline{background:transparent;color:hsl(220 10% 95%);border-color:hsl(var(--border))}
  .ghost{background:transparent;color:hsl(220 10% 95%)}
  .accent{background:hsl(220 70% 55% / .1);color:hsl(220 70% 70%);border-color:hsl(220 70% 55% / .4)}
  .link{background:transparent;color:hsl(220 70% 60%);text-decoration:underline;text-underline-offset:4px;padding:0}
  .pill{border-radius:9999px;padding:0 24px;height:44px}
</style>
</head>
<body>
  <div class="row">
    <button class="btn primary">Primary</button>
    <button class="btn secondary">Secondary</button>
    <button class="btn outline">Outline</button>
    <button class="btn ghost">Ghost</button>
    <button class="btn accent">Accent</button>
    <button class="btn link">Link →</button>
  </div>
  <div class="row">
    <button class="btn primary pill">Get started</button>
    <button class="btn outline pill">Learn more</button>
  </div>
</body>
</html>
