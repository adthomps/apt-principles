<!DOCTYPE html>
<!-- @dsCard group="Components" name="Header / top nav" subtitle="Sticky translucent header, route-aware links, utility icons" viewport="700x130" -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @import url("../colors_and_type.css");
  html,body{margin:0}
  body{background:hsl(220 20% 8%);font-family:var(--font-sans);color:hsl(220 10% 95%);padding:0}
  .strip{position:relative;background-image:
    radial-gradient(ellipse 80% 60% at 50% -30%, hsl(220 70% 55% / .14), transparent),
    radial-gradient(ellipse 50% 40% at 85% 0%, hsl(165 45% 40% / .08), transparent);
    background-color:hsl(220 20% 8%);padding-bottom:26px}
  .nav{height:60px;display:flex;align-items:center;border-bottom:1px solid hsl(var(--border) / .6);
    background:hsl(220 20% 8% / .72);backdrop-filter:blur(12px)}
  .inner{width:100%;padding:0 22px;display:flex;align-items:center;gap:16px}
  .brand{display:flex;align-items:center;gap:10px}
  .em{width:32px;height:32px;border-radius:50%;border:1px solid hsl(220 70% 55% / .6);background:hsl(220 20% 8% / .8);
    color:hsl(220 70% 62%);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
  .eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.18em;color:hsl(var(--muted-foreground));white-space:nowrap}
  .name{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .links{display:flex;gap:2px;margin-left:14px}
  .lnk{padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500;color:hsl(var(--muted-foreground))}
  .lnk.active{background:hsl(220 70% 55% / .12);color:hsl(220 70% 64%)}
  .sp{flex:1}
  .util{display:flex;gap:6px;color:hsl(var(--muted-foreground))}
  .util span{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center}
  .util svg{width:17px;height:17px}
  .cap{padding:14px 22px 0;font-size:11px;color:hsl(var(--muted-foreground))}
  .cap b{color:hsl(220 10% 90%)}
</style>
</head>
<body>
  <div class="strip">
    <div class="nav">
      <div class="inner">
        <div class="brand"><span class="em">A</span><div><div class="eyebrow">Applied Practical Thinking</div><div class="name">APT</div></div></div>
        <div class="links">
          <span class="lnk active">Home</span><span class="lnk">Labs</span><span class="lnk">Proof</span><span class="lnk">Principles</span><span class="lnk">Insights</span><span class="lnk">About</span>
        </div>
        <div class="sp"></div>
        <div class="util">
          <span><svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
          <span><svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 2A10 10 0 0 0 8.84 21.5c.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5A10 10 0 0 0 12 2Z"/></svg></span>
        </div>
      </div>
    </div>
    <div class="cap"><b>Header / top nav</b> — sticky, translucent, blurred · brand block · route-aware links (active = primary) · utility icons</div>
  </div>
</body>
</html>
