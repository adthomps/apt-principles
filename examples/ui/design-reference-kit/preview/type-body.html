<!DOCTYPE html>
<!-- @dsCard group="Type" name="Body & utility type" subtitle="Heading, body, eyebrow, mono/code" viewport="700x210" -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @import url("../colors_and_type.css");
  html,body{margin:0}
  body{background:hsl(220 20% 8%);color:hsl(220 10% 95%);font-family:var(--font-sans);padding:24px}
  .spec{display:flex;align-items:baseline;gap:14px;padding:8px 0;border-bottom:1px solid hsl(var(--border) / .5)}
  .spec:last-child{border:0}
  .tag{font-family:var(--font-mono);font-size:10.5px;color:hsl(var(--muted-foreground));width:120px;flex-shrink:0}
  .h4{font-size:18px;font-weight:600}
  .body{font-size:16px;line-height:1.6}
  .cap{font-size:12px;color:hsl(var(--muted-foreground));text-transform:uppercase;letter-spacing:.12em}
  code{font-family:var(--font-mono);font-size:13px;background:hsl(var(--muted) / .6);border:1px solid hsl(var(--border));border-radius:5px;padding:2px 7px}
</style>
</head>
<body>
  <div class="spec"><span class="tag">h4 · 600</span><span class="h4">Section heading</span></div>
  <div class="spec"><span class="tag">body · 1.6</span><span class="body">Concise, precise, non-marketing copy in the system stack.</span></div>
  <div class="spec"><span class="tag">eyebrow</span><span class="cap">Applied Practical Thinking</span></div>
  <div class="spec"><span class="tag">mono / code</span><span class="body"><code>--primary: 220 70% 55%</code></span></div>
</body>
</html>
