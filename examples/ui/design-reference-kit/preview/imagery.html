<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Marketing imagery" subtitle="Serif covers — flat, navy, amber tag, outline icon" viewport="700x175" -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @import url("../colors_and_type.css");
  html,body{margin:0}
  body{background:hsl(220 20% 8%);font-family:var(--font-sans);padding:20px}
  .row{display:flex;gap:12px}
  figure{margin:0;flex:1;border-radius:9px;overflow:hidden;border:1px solid hsl(var(--border))}
  img{display:block;width:100%;height:118px;object-fit:cover}
  figcaption{font-size:11px;color:hsl(var(--muted-foreground));padding:7px 9px;background:hsl(var(--card))}
</style>
</head>
<body>
  <div class="row">
    <figure><img src="../assets/blog-decision-driven.webp" alt="Decision-Driven Development cover"><figcaption>Serif headline · amber tag · outline icon</figcaption></figure>
    <figure><img src="../assets/blog-feedback-multiplier.webp" alt="Feedback Multiplier cover"><figcaption>Cool navy field · flat, no photography</figcaption></figure>
    <figure><img src="../assets/blog-creative-coding.webp" alt="Creative Coding cover"><figcaption>Editorial weight for content covers</figcaption></figure>
  </div>
</body>
</html>
