<!DOCTYPE html>
<!-- @dsCard group="Components" name="Stepper / wizard" subtitle="Linear multi-step flow — done · active · upcoming, with progress connector" viewport="640x230" -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @import url("../colors_and_type.css");
  html,body{margin:0}
  body{background:hsl(220 20% 8%);color:hsl(220 10% 95%);font-family:var(--font-sans);padding:34px 26px;display:flex;align-items:center}
  .stepper{display:flex;align-items:flex-start;width:100%}
  .node{display:flex;flex-direction:column;align-items:center;gap:9px;flex-shrink:0;width:92px;text-align:center}
  .bead{width:30px;height:30px;border-radius:50%;border:2px solid hsl(var(--border));display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:hsl(var(--muted-foreground));background:hsl(var(--card))}
  .bead svg{width:15px;height:15px}
  .node.done .bead{background:hsl(var(--primary));border-color:hsl(var(--primary));color:hsl(220 20% 99%)}
  .node.active .bead{border-color:hsl(var(--primary));color:hsl(var(--primary));box-shadow:0 0 0 4px hsl(var(--primary) / .15)}
  .lbl{font-size:11.5px;line-height:1.35}
  .lbl b{display:block;font-weight:600;color:hsl(var(--foreground))}
  .node:not(.done):not(.active) .lbl b{color:hsl(var(--muted-foreground))}
  .lbl small{color:hsl(var(--muted-foreground));font-size:10.5px}
  .bar{flex:1;height:2px;background:hsl(var(--border));margin-top:14px;border-radius:2px;position:relative;overflow:hidden}
  .bar.fill::after{content:"";position:absolute;inset:0;background:hsl(var(--primary))}
</style>
</head>
<body>
  <div class="stepper">
    <div class="node done"><div class="bead"><svg fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div><div class="lbl"><b>Account</b><small>Identity</small></div></div>
    <div class="bar fill"></div>
    <div class="node done"><div class="bead"><svg fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div><div class="lbl"><b>Workspace</b><small>Name &amp; theme</small></div></div>
    <div class="bar"></div>
    <div class="node active"><div class="bead">3</div><div class="lbl"><b>Connect</b><small>Link a repo</small></div></div>
    <div class="bar"></div>
    <div class="node"><div class="bead">4</div><div class="lbl"><b>Review</b><small>Confirm</small></div></div>
  </div>
</body>
</html>
