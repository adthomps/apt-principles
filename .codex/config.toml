# Codex configuration for apt-principles
# This repo is a documentation and doctrine repository — no application code.

[model]
default = "o4-mini"

[context]
# Files Codex should read before starting any task in this repo
files = [
  "AGENTS.md",
  "README.md",
  ".codex/prompts/review-repo.md",
]

[instructions]
# Point Codex to the structured prompt for general tasks
default_prompt = ".codex/prompts/implement-feature.md"
